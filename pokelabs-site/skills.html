<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skills — poke labs</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--fg:#fff;--dim:#555;--muted:#333;
  --font-mono:'SF Mono','Fira Code','Fira Mono',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:16px;line-height:1.6}
body{min-height:100vh}
a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--muted);transition:border-color .2s}
a:hover{border-color:var(--fg)}
nav{max-width:960px;margin:0 auto;padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #111}
nav .logo{font-family:var(--font-mono);font-size:13px;font-weight:700}
nav .logo span{color:var(--dim)}
nav a{font-family:var(--font-mono);font-size:11px;color:var(--dim);border:none;text-transform:uppercase;letter-spacing:.05em}
nav a:hover{color:var(--fg)}
.container{max-width:960px;margin:0 auto;padding:40px 24px}
h1{font-family:var(--font-mono);font-size:24px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:14px;margin-bottom:32px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.search-input{flex:1;min-width:250px;padding:10px 12px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;color:var(--fg);font-size:14px;outline:none}
.search-input:focus{border-color:#333}
.filter-select{padding:10px 12px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;color:var(--fg);font-size:14px;cursor:pointer}
.toggle{padding:6px 12px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;color:var(--dim);cursor:pointer;font-family:var(--font-mono);font-size:11px}
.toggle.active{border-color:#333;color:var(--fg)}
.stats{display:flex;gap:24px;color:var(--muted);font-family:var(--font-mono);font-size:11px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;padding:16px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card h3{font-size:14px;color:#fff;font-family:var(--font-mono)}
.card h3 span{color:var(--muted);font-weight:400;font-size:11px;margin-left:8px}
.source{font-family:var(--font-mono);font-size:10px;color:var(--muted);border:1px solid #1a1a1a;padding:2px 6px;border-radius:3px;white-space:nowrap}
.card p{color:var(--dim);font-size:13px;line-height:1.5;margin-bottom:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:10px;color:var(--muted);border:1px solid #1a1a1a;padding:2px 6px;border-radius:3px}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #0a0a0a}
.card-footer a{color:var(--fg);text-decoration:none;font-family:var(--font-mono);font-size:11px;border-bottom:1px solid var(--muted)}
.card-footer a:hover{border-color:var(--fg)}
.loading{text-align:center;padding:48px;color:var(--dim)}
.empty{text-align:center;padding:32px;color:var(--dim)}
footer{border-top:1px solid #111;padding:24px;margin-top:40px}
footer p{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<nav>
  <div class="logo">poke<span> labs</span></div>
  <a href="/">← back</a>
</nav>
<div class="container">
  <h1>skills market</h1>
  <p class="subtitle">discover, use, and share ai agent skills.</p>

  <div class="filters">
    <input class="search-input" type="text" id="search" placeholder="search skills by name or description...">
    <select class="filter-select" id="sourceFilter">
      <option value="all">all sources</option>
      <option value="official">official</option>
      <option value="community">community</option>
    </select>
    <button class="toggle" id="pinnedToggle">pinned only</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"><div class="loading">loading skills...</div></div>
</div>
<footer><p>poke labs © 2026 · mit license</p></footer>

<script>
const API = '/api/skills-index.json';
let allSkills = [];
let pinned = JSON.parse(localStorage.getItem('poked_skills') || '[]');

async function loadSkills() {
  try {
    const r = await fetch(API);
    const data = await r.json();
    allSkills = data.skills || [];
    render();
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="loading">could not load skills index.</div>';
  }
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const src = document.getElementById('sourceFilter').value;
  const pinnedOnly = document.getElementById('pinnedToggle').classList.contains('active');
  let filtered = allSkills.filter(s => {
    const matchQ = !q || s.name.toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q);
    const matchSrc = src === 'all' || (s.source||'').toLowerCase().includes(src.slice(0,3));
    const matchPinned = !pinnedOnly || pinned.includes(s.name);
    return matchQ && matchSrc && matchPinned;
  });
  filtered.sort((a,b) => {
    const pa = pinned.includes(a.name) ? 0 : 1;
    const pb = pinned.includes(b.name) ? 0 : 1;
    return pa - pb || a.name.localeCompare(b.name);
  });
  document.getElementById('stats').innerHTML = '<span>' + filtered.length + ' skills</span><span>' + pinned.length + ' pinned</span>';
  if (!filtered.length) {
    document.getElementById('grid').innerHTML = '<div class="empty">no skills match your filters.</div>';
    return;
  }
  document.getElementById('grid').innerHTML = filtered.map(s => {
    const isPinned = pinned.includes(s.name);
    return '<div class="card' + (isPinned?' pinned':'') + '">' +
      '<div class="card-header"><h3>' + s.name + '<span>' + (s.version||'v1') + '</span></h3>' +
      '<span class="source">' + (s.source||'official') + '</span></div>' +
      '<p>' + (s.description||'No description.') + '</p>' +
      '<div class="tags">' + (s.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('') + '</div>' +
      '<div class="card-footer"><a href="' + (s.url||'#') + '">view →</a>' +
      '<span>' + (isPinned?'pinned':'<span onclick="togglePin(\''+s.name+'\')" style="cursor:pointer;color:var(--muted);font-family:var(--font-mono);font-size:11px">pin</span>') + '</span></div>' +
      '</div>';
  }).join('');
}

function togglePin(name) {
  const i = pinned.indexOf(name);
  if (i >= 0) pinned.splice(i,1); else pinned.push(name);
  localStorage.setItem('poked_skills', JSON.stringify(pinned));
  render();
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('sourceFilter').addEventListener('change', render);
document.getElementById('pinnedToggle').addEventListener('click', function(){this.classList.toggle('active');render()});

loadSkills();
</script>
</body>
</html>
