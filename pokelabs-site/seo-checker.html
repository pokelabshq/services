<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>seo meta checker — poke labs</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--fg:#fff;--dim:#555;--muted:#333;
  --font-mono:'SF Mono','Fira Code','Fira Mono',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:16px;line-height:1.6}
body{min-height:100vh}
a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--muted);transition:border-color .2s}
a:hover{border-color:var(--fg)}
nav{max-width:960px;margin:0 auto;padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #111}
nav .logo{font-family:var(--font-mono);font-size:13px;font-weight:700}
nav .logo span{color:var(--dim)}
nav a{font-family:var(--font-mono);font-size:11px;color:var(--dim);border:none;text-transform:uppercase;letter-spacing:.05em}
nav a:hover{color:var(--fg)}
.container{max-width:960px;margin:0 auto;padding:40px 24px}
h1{font-family:var(--font-mono);font-size:24px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:14px;margin-bottom:32px}
.input-row{display:flex;gap:12px;max-width:700px;margin:0 auto 24px}
.input-row input{flex:1;padding:10px 12px;border-radius:4px;border:1px solid #1a1a1a;background:#0a0a0a;color:var(--fg);font-size:14px;outline:none}
.input-row input:focus{border-color:#333}
.btn{padding:10px 20px;border-radius:4px;font-family:var(--font-mono);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;color:var(--bg);background:var(--fg)}
.btn:hover{background:#ccc}
.result{max-width:700px;margin:0 auto}
.score-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;padding:24px;text-align:center;margin-bottom:16px}
.score-card .score{font-family:var(--font-mono);font-size:48px;font-weight:700}
.score-card .grade{font-family:var(--font-mono);font-size:14px;color:var(--dim)}
.meta-table{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;padding:20px;margin-bottom:16px}
.meta-table h3{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.meta-table table{width:100%;border-collapse:collapse}
.meta-table td{padding:8px 0;border-bottom:1px solid #0a0a0a;font-size:12px}
.meta-table td:first-child{color:var(--muted);width:40%;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.issues{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;padding:20px}
.issues h3{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.issues li{padding:4px 0;color:var(--dim);font-size:13px;list-style:none}
.issues li:before{content:"• ";color:var(--muted)}
.preview-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;padding:20px;margin-bottom:16px}
.preview-card h3{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.preview-box{border:1px solid #1a1a1a;border-radius:4px;padding:16px;background:var(--bg)}
.preview-box .p-title{font-size:16px;font-weight:600;color:#fff;margin-bottom:4px}
.preview-box .p-desc{color:var(--dim);font-size:13px;margin-bottom:4px}
.preview-box .p-url{color:var(--muted);font-size:11px;font-family:var(--font-mono)}
.preview-box img{max-width:100%;border-radius:4px;margin-bottom:8px}
.loading{text-align:center;padding:48px;color:var(--dim)}
footer{border-top:1px solid #111;padding:24px;margin-top:40px}
footer p{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<nav>
  <div class="logo">poke<span> labs</span></div>
  <a href="/">← back</a>
</nav>
<div class="container">
  <h1>seo meta checker</h1>
  <p class="subtitle">check your open graph tags, twitter cards, and meta description. free, no signup.</p>
  <div class="input-row">
    <input type="text" id="urlInput" placeholder="enter your url... e.g. https://yoursite.com">
    <button class="btn" onclick="check()">check seo</button>
  </div>
  <div class="result" id="result"></div>
</div>
<footer><p>free tool by poke labs — mit licensed</p></footer>

<script>
async function check(){
  const url=document.getElementById('urlInput').value;
  const r=document.getElementById('result');
  if(!url){r.innerHTML='<div class="loading">please enter a url</div>';return;}
  r.innerHTML='<div class="loading">analyzing your page...</div>';
  try{
    const res=await fetch('/api/seo-audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const d=await res.json();
    if(d.error==='limit'){r.innerHTML='<div class="loading">free limit reached</div>';return;}
    if(d.error){r.innerHTML='<div class="loading">error: '+d.error+'</div>';return;}
    let html=`<div class="score-card"><div class="score">${d.score}/100</div><div class="grade">grade: ${d.grade} — ${d.checks_passed}/${d.checks_total} checks passed</div></div>`;
    if(d.meta){
      if(d.meta.image||d.meta.og_title){
        html+='<div class="preview-card"><h3>social preview</h3><div class="preview-box">';
        if(d.meta.image)html+='<img src="'+d.meta.image+'" />';
        html+='<div class="p-title">'+(d.meta.og_title||d.meta.title||'')+'</div>';
        html+='<div class="p-desc">'+(d.meta.og_description||d.meta.description||'')+'</div>';
        html+='<div class="p-url">'+d.url+'</div></div></div>';
      }
      html+='<div class="meta-table"><h3>meta tags found</h3><table>';
      const labels={'title':'title tag','og_title':'og:title','description':'meta description','og_description':'og:description','image':'og:image','og_site_name':'og:site_name','favicon':'favicon','twitter_title':'twitter:title','twitter_description':'twitter:description','twitter_image':'twitter:image'};
      for(const[k,v] of Object.entries(labels)){const val=d.meta[k]||'';html+='<tr><td>'+v+'</td><td>'+(val?('<code>'+val.substring(0,120)+(val.length>120?'...':'')+'</code>'):'<span style="color:var(--muted)">missing</span>')+'</td></tr>';}
      html+='</table></div>';
    }
    if(d.issues&&d.issues.length){
      html+='<div class="issues"><h3>issues ('+d.issues.length+')</h3><ul>';
      for(const i of d.issues)html+='<li>'+i+'</li>';
      html+='</ul></div>';
    } else if(d.issues) {
      html+='<div class="score-card"><div class="score" style="font-size:24px">all checks passed</div></div>';
    }
    if(d.free_remaining!==undefined)html+='<p style="text-align:center;color:var(--muted);margin-top:16px;font-family:var(--font-mono);font-size:11px">'+d.free_remaining+' free checks remaining today</p>';
    r.innerHTML=html;
  }catch(e){r.innerHTML='<div class="loading">failed: '+e.message+'</div>';}
}
document.getElementById('urlInput').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
</script>
</body>
</html>
