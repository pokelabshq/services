<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>og image generator — poke labs</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--fg:#fff;--dim:#555;--muted:#333;
  --font-mono:'SF Mono','Fira Code','Fira Mono',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:16px;line-height:1.6}
body{min-height:100vh}
a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--muted);transition:border-color .2s}
a:hover{border-color:var(--fg)}
nav{max-width:960px;margin:0 auto;padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #111}
nav .logo{font-family:var(--font-mono);font-size:13px;font-weight:700}
nav .logo span{color:var(--dim)}
nav a{font-family:var(--font-mono);font-size:11px;color:var(--dim);border:none;text-transform:uppercase;letter-spacing:.05em}
nav a:hover{color:var(--fg)}
.container{max-width:960px;margin:0 auto;padding:40px 24px}
h1{font-family:var(--font-mono);font-size:24px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--dim);font-size:14px;margin-bottom:32px}
.builder{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;padding:24px;margin-bottom:24px}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.form-row input,.form-row textarea{width:100%;padding:10px 12px;border-radius:4px;border:1px solid #1a1a1a;background:var(--bg);color:var(--fg);font-size:14px;outline:none;font-family:inherit}
.form-row input:focus,.form-row textarea:focus{border-color:#333}
.form-row textarea{resize:vertical;min-height:60px}
.form-row .color-row{display:flex;gap:12px;align-items:center}
.form-row .color-row input[type=color]{width:50px;height:40px;padding:2px;border-radius:4px;cursor:pointer;border:1px solid #1a1a1a}
.form-row .color-row input[type=text]{width:120px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preset{width:30px;height:30px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.preset:hover{transform:scale(1.15);border-color:var(--fg)}
.btn{padding:10px 20px;border-radius:4px;font-family:var(--font-mono);font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;color:var(--bg);background:var(--fg)}
.btn:hover{background:#ccc}
.btn-secondary{background:transparent;color:var(--dim);border-color:#333}
.btn-secondary:hover{color:var(--fg);border-color:var(--fg)}
.btn-row{display:flex;gap:12px;margin-top:20px}
.preview-area{max-width:700px;margin:0 auto}
.preview-box{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:4px;padding:20px;text-align:center}
.preview-box h3{font-family:var(--font-mono);font-size:12px;margin-bottom:16px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.preview-box img{max-width:100%;border-radius:4px}
.api-block{background:var(--bg);border:1px solid #1a1a1a;border-radius:4px;padding:16px;margin-top:16px;text-align:left;font-family:var(--font-mono);font-size:11px;overflow-x:auto;color:var(--muted);line-height:1.8}
.loading{color:var(--muted);padding:32px;text-align:center}
footer{border-top:1px solid #111;padding:24px;margin-top:40px}
footer p{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<nav>
  <div class="logo">poke<span> labs</span></div>
  <a href="/">← back</a>
</nav>
<div class="container">
  <h1>og image generator</h1>
  <p class="subtitle">create 1200x630 social preview images. free, no signup, no watermark.</p>

  <div class="builder">
    <div class="form-row"><label>title</label><input type="text" id="ogTitle" placeholder="Your Page Title" value="Hello World"></div>
    <div class="form-row"><label>description (optional)</label><textarea id="ogDesc" placeholder="A short description...">Build something amazing today.</textarea></div>
    <div class="form-row"><label>site name (optional)</label><input type="text" id="ogSite" placeholder="yourbrand.com"></div>
    <div class="form-row">
      <label>background</label>
      <div class="color-row">
        <input type="color" id="ogBgColor1" value="#1a1a1a">
        <span style="color:var(--muted)">→</span>
        <input type="color" id="ogBgColor2" value="#333333">
      </div>
      <div class="presets">
        <div class="preset" style="background:linear-gradient(135deg,#1a1a1a,#333)" onclick="setPreset('#1a1a1a','#333333')"></div>
        <div class="preset" style="background:linear-gradient(135deg,#000,#1a1a1a)" onclick="setPreset('#000000','#1a1a1a')"></div>
        <div class="preset" style="background:linear-gradient(135deg,#1a1a1a,#2a2a2a)" onclick="setPreset('#1a1a1a','#2a2a2a')"></div>
        <div class="preset" style="background:linear-gradient(135deg,#333,#555)" onclick="setPreset('#333333','#555555')"></div>
        <div class="preset" style="background:linear-gradient(135deg,#0a0a0a,#1a1a2e)" onclick="setPreset('#0a0a0a','#1a1a2e')"></div>
        <div class="preset" style="background:linear-gradient(135deg,#1a1a2e,#16213e)" onclick="setPreset('#1a1a2e','#16213e')"></div>
      </div>
    </div>
    <div class="form-row">
      <label>layout</label>
      <div class="presets" id="layoutPresets">
        <div class="preset" style="width:60px;background:var(--bg);border:1px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)" onclick="setLayout('center')" title="Center">center</div>
        <div class="preset" style="width:60px;background:var(--bg);border:1px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)" onclick="setLayout('left')" title="Left">left</div>
        <div class="preset" style="width:60px;background:var(--bg);border:1px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)" onclick="setLayout('split')" title="Split">split</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="generate()">generate image</button>
      <button class="btn btn-secondary" onclick="downloadImg()">download png</button>
    </div>
  </div>

  <div class="preview-area" id="previewArea"></div>
</div>
<footer><p>free tool by poke labs — mit licensed</p></footer>

<script>
let currentBlob=null;
function setPreset(c1,c2){document.getElementById('ogBgColor1').value=c1;document.getElementById('ogBgColor2').value=c2;}
let currentLayout='center';
function setLayout(l){currentLayout=l;}

async function generate(){
  const params=new URLSearchParams({
    title:document.getElementById('ogTitle').value,
    desc:document.getElementById('ogDesc').value,
    site:document.getElementById('ogSite').value,
    bg1:document.getElementById('ogBgColor1').value,
    bg2:document.getElementById('ogBgColor2').value,
    layout:currentLayout
  });
  const prev=document.getElementById('previewArea');
  prev.innerHTML='<div class="loading">generating...</div>';
  try{
    const r=await fetch('/api/og-generate?'+params);
    if(r.status===402){prev.innerHTML='<div class="loading">free limit reached</div>';return;}
    if(!r.ok){const t=await r.text();prev.innerHTML='<div class="loading">error: '+t+'</div>';return;}
    const blob=await r.blob();
    currentBlob=blob;
    const url=URL.createObjectURL(blob);
    prev.innerHTML='<div class="preview-box"><h3>your og image (1200×630)</h3><img src="'+url+'" alt="OG Image"/><div class="api-block">&lt;meta property="og:image" content="https://pokelabs.org/api/og-generate?title=Hello+World" /&gt;</div></div>';
  }catch(e){prev.innerHTML='<div class="loading">failed: '+e.message+'</div>';}
}

function downloadImg(){
  if(!currentBlob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(currentBlob);
  a.download='og-image.png';
  a.click();
}
</script>
</body>
</html>
