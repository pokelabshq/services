name: Auto Label Issues
on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue || context.payload.pull_request || {}).title || '';
            const body = (context.payload.issue || context.payload.pull_request || {}).body || '';
            const text = (title + ' ' + body).toLowerCase();
            const num = (context.payload.issue || context.payload.pull_request || {}).number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            const labels = [];
            
            // Priority labels for issues
            if (context.payload.issue) {
              if (/crash|security|data.loss|outage|emergency|critical/.test(text)) labels.push('P0-critical');
              else if (/bug|error|fail|broken|regression|urgent/.test(text)) labels.push('P1-bug');
              else if (/feature|enhancement|improve|request/.test(text)) labels.push('P2-feature');
              else if (/docs|documentation|typo|style|cleanup|refactor|chore/.test(text)) labels.push('P3-chore');
              else labels.push('P2-feature');
            }
            
            // Size labels for PRs
            if (context.payload.pull_request) {
              const changed = context.payload.pull_request.changed_files || 0;
              if (changed < 10) labels.push('size-S');
              else if (changed < 50) labels.push('size-M');
              else if (changed < 200) labels.push('size-L');
              else labels.push('size-XL');
            }
            
            // Type labels
            if (/test|spec|coverage/.test(text)) labels.push('tests');
            if (/readme|doc|wiki|guide/.test(text)) labels.push('documentation');
            if (/fix|hotfix|patch/.test(text)) labels.push('fix');
            if (/dependabot|bump|upgrade/.test(text)) labels.push('dependencies');
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: num, labels
              });
              console.log(`Labeled #${num}: ${labels.join(', ')}`);
            }
